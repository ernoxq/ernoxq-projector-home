<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пульт">
<meta name="theme-color" content="#000000">
<title>Пульт</title>
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--surface:#1E1E20;--tile:#2C2C2E;--line:rgba(255,255,255,.09);--fg:#F2F2F4;--dim:#8E8E93;--accent:#FBE38E;--orange:#FF9F0A;--indigo:#5E5CE6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Inter Tight',-apple-system,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 22px);gap:20px}
button{font-family:inherit;border:none;color:var(--fg);background:none;padding:0;cursor:pointer;transition:transform .16s cubic-bezier(.2,.8,.2,1),background .25s,color .25s}
button:active{transform:scale(.93)}
svg{display:block}
.glass{background:linear-gradient(180deg,#262628,#1A1A1C);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px var(--line)}

/* ---------- main remote ---------- */
.top{display:flex;align-items:center;gap:12px}
.round{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.round svg{stroke:var(--dim)}
.round.on svg{stroke:var(--accent)}
.device{flex:1;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:600;letter-spacing:-.2px}
.device .dot{width:8px;height:8px;border-radius:4px;background:#5A5A5E;transition:background .3s}
.device .dot.on{background:#30D158}
.device svg{stroke:var(--dim)}
.pad{position:relative;flex:1;border-radius:44px;background:var(--surface);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pad .glow{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;will-change:transform;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),rgba(255,255,255,0) 68%);opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s;pointer-events:none}
.pad.touch .glow{opacity:1}
.pad .ring{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:2px solid rgba(255,255,255,.5);opacity:0;pointer-events:none}
.pad .ring.go{animation:ring .42s ease-out}
.pad .edge{position:absolute;background:radial-gradient(ellipse at center,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);opacity:0;pointer-events:none}
.pad .edge.up{left:15%;right:15%;top:-30px;height:80px}.pad .edge.down{left:15%;right:15%;bottom:-30px;height:80px}
.pad .edge.left{top:15%;bottom:15%;left:-30px;width:80px}.pad .edge.right{top:15%;bottom:15%;right:-30px;width:80px}
.pad .edge.go{animation:edge .36s ease-out}
.pad .hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;color:#5E5E63;line-height:1.5;transition:opacity .5s;pointer-events:none}
.pad .toast{position:absolute;left:50%;top:22px;transform:translateX(-50%) translateY(-8px);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 14px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.pad .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}
@keyframes edge{0%{opacity:1}100%{opacity:0}}
.bottom{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.b{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.b svg{stroke:var(--dim)}
.b.big{width:112px;height:112px;background:linear-gradient(180deg,#1B1B1D,#101011)}

/* ---------- keyboard bar (only when a text field is selected on the projector) ---------- */
.kbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:436px;margin:0 auto;background:rgba(30,30,33,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:30px;padding:7px;display:flex;gap:8px;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.6);transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;z-index:5}
.kbar.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.kbar input{flex:1;min-width:0;height:50px;border-radius:25px;border:none;padding:0 18px;font:500 17px 'Inter Tight',sans-serif;background:#2C2C2E;color:#F5F5F7;caret-color:#F5F5F7;outline:none;user-select:text;-webkit-user-select:text}
.kbar input::placeholder{color:#8E8E93}
.kbar button{height:50px;padding:0 20px;border-radius:25px;background:#F5F5F7;color:#1C1C1E;font-weight:600;font-size:15px;white-space:nowrap}
.kbar .x{width:44px;padding:0;background:transparent;color:#F5F5F7;display:flex;align-items:center;justify-content:center}

.ytpill{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translate(-50%,20px);opacity:0;pointer-events:none;height:48px;padding:0 20px 0 14px;border-radius:24px;background:#F5F5F7;color:#1C1C1E;font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1,.3,1),opacity .25s;z-index:4;white-space:nowrap}
.ytpill.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
/* ---------- control center (iOS style) ---------- */
.cc{position:fixed;inset:0;z-index:10;background:rgba(14,14,16,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);opacity:0;pointer-events:none;transition:opacity .28s ease;will-change:opacity;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.cc.show{opacity:1;pointer-events:auto}
.ccin{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 30px);--g:14px;--c:calc((min(100vw,420px) - 44px - 3 * var(--g)) / 4)}
.cchead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cchead .sm{width:46px;height:46px;border-radius:23px}
.cctitle{text-align:center;font-size:19px;font-weight:600;margin:4px 0 22px;display:flex;align-items:center;justify-content:center;gap:8px}
.cctitle .dot{width:9px;height:9px;border-radius:5px;background:#5A5A5E}
.cctitle .dot.on{background:#30D158}
.grid{display:grid;grid-template-columns:repeat(4,var(--c));grid-auto-rows:var(--c);gap:var(--g)}
.lg{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.07)}
.mod{border-radius:34px;position:relative;overflow:hidden}
.s2{grid-column:span 2;grid-row:span 2}
.w2{grid-column:span 2}
.h2{grid-row:span 2}
.w4{grid-column:span 4}
.rb{border-radius:50%;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.rb svg{stroke:#F5F5F7}
.rb.white{background:#F5F5F7;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rb.white svg{stroke:#FF453A}
/* connectivity-style module with four round toggles */
.conn{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;padding:14px}
.conn .rb{background:rgba(255,255,255,.14)}
.conn .rb.on.ns{background:#FF9F0A}
.conn .rb.on.sl{background:#5E5CE6}
.conn .rb.on.blue{background:#0A84FF}
/* now playing module */
.np{padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.np .art{width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.12) center/cover no-repeat}
.np .air{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:19px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.np b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np span{display:block;font-size:13px;color:rgba(235,235,245,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.np .ctl{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.np .ctl button svg{fill:#F5F5F7}
/* tall sliders */
.vs{border-radius:calc(var(--c) / 2);position:relative;overflow:hidden;touch-action:none}
.vs .fill{position:absolute;left:0;right:0;bottom:0;top:0;background:#F5F5F7;transform-origin:50% 100%;transform:scaleY(.4);transition:transform .12s ease-out;will-change:transform}
.vs[data-drag] .fill{transition:none}
.vs .ic{position:absolute;left:50%;bottom:calc(var(--c) * .32);transform:translate(-50%,50%);pointer-events:none}
/* focus-style pill */
.pill{border-radius:calc(var(--c) / 2);display:flex;align-items:center;gap:12px;padding:0 18px 0 10px;text-align:left}
.pill .dotc{width:calc(var(--c) - 22px);height:calc(var(--c) - 22px);border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .25s}
.pill.on .dotc{background:#F5F5F7}
.pill b{display:block;font-size:16px;font-weight:600}
.pill span{display:block;font-size:12px;color:rgba(235,235,245,.6);margin-top:1px}
/* warmth slider */
.warm{border-radius:calc(var(--c) / 2);display:none;align-items:center;padding:0 16px;gap:12px}
.warm.show{display:flex}
.warm small{font-size:12px;font-weight:600;color:rgba(235,235,245,.7);white-space:nowrap}
.hs{position:relative;flex:1;height:30px;border-radius:15px;background:linear-gradient(90deg,#FFD9B0,#FF8A2A);touch-action:none}
.hs .knob{position:absolute;top:1px;width:28px;height:28px;margin-left:-14px;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);left:50%}
.typer{display:none;gap:8px;margin-top:var(--g)}
.typer.show{display:flex}
.typer input{flex:1;min-width:0;height:52px;border-radius:26px;border:none;padding:0 18px;font:500 16px 'Inter Tight',sans-serif;background:rgba(255,255,255,.14);color:#F5F5F7;outline:none;user-select:text;-webkit-user-select:text}
.typer input::placeholder{color:rgba(235,235,245,.5)}
.typer button{height:52px;padding:0 20px;border-radius:26px;background:#F5F5F7;color:#000;font-weight:600;font-size:15px}
.warn{display:none;background:var(--accent);color:#121212;border-radius:22px;padding:12px 14px;font-size:14px;line-height:1.35;align-items:center;gap:10px;margin-bottom:var(--g)}
.warn.show{display:flex}
.warn button{height:36px;padding:0 14px;border-radius:18px;background:#121212;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
/* entrance */
.cc .ccin{transform:scale(.96);transition:transform .38s cubic-bezier(.2,1,.3,1);will-change:transform}
.cc.show .ccin{transform:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="round glass" id="mute" aria-label="Без звука" onclick="vol('mute')">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button class="device glass" aria-label="Пункт управления" onclick="openSheet()">
      <span class="dot" id="dot"></span><span id="st">Проектор</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="round glass" aria-label="Выключить" onclick="if(confirm('Выключить проектор?'))key('power')">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 3.5v8M6.6 6.8a7.5 7.5 0 1 0 10.8 0"/></svg>
    </button>
  </div>

  <div class="pad" id="pad" aria-label="Тачпад">
    <div class="glow" id="glow"></div>
    <div class="ring" id="ring"></div>
    <div class="edge up"></div><div class="edge down"></div><div class="edge left"></div><div class="edge right"></div>
    <div class="toast" id="toast"></div>
    <div class="hint" id="hint">Свайп — двигаться · касание — выбрать<br>Двумя пальцами вверх/вниз — громкость</div>
  </div>

  <div class="bottom">
    <button class="b glass" aria-label="Пауза или воспроизведение" onclick="media('play')">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 6.5v11l7.5-5.5z"/><path d="M15 6.5v11M19.5 6.5v11"/></svg>
    </button>
    <button class="b big glass" aria-label="Назад" onclick="key('back')">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5L7.5 12l7.5 7.5"/></svg>
    </button>
    <button class="b glass" aria-label="Домой" onclick="key('home')">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6"/></svg>
    </button>
  </div>
</div>

<button class="ytpill" id="ytpill" onclick="openYtSearch()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>Поиск в YouTube</button>

<div class="kbar" id="kbar">
  <button class="x" aria-label="Скрыть" onclick="hideKbar(true)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
  <input id="kin" placeholder="Нажми и печатай" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
  <button onclick="submitKbar()">Готово</button>
</div>

<div class="cc" id="cc" role="dialog" aria-label="Пункт управления">
 <div class="ccin" id="ccin">
  <div class="cchead">
    <button class="sm lg rb" aria-label="Закрыть" onclick="closeSheet()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="sm lg rb" aria-label="Выключить проектор" onclick="if(confirm('Выключить проектор?'))key('power')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 3.5v8M6.6 6.8a7.5 7.5 0 1 0 10.8 0"/></svg></button>
  </div>
  <div class="cctitle"><span class="dot" id="ccdot"></span>HY300 Pro</div>
  <div class="warn" id="warn"><div>Управление ещё не подключено. Нажми и выбери на проекторе <b>Allow</b>.</div><button onclick="api('/api/setup')">Настроить</button></div>

  <div class="grid">
    <div class="mod lg s2 conn">
      <button class="rb ns" id="tgns" aria-label="Night Shift" onclick="toggleWarm()"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v1.8M12 19.4v1.8M2.8 12h1.8M19.4 12h1.8M5.6 5.6l1.2 1.2M17.2 17.2l1.2 1.2M5.6 18.4l1.2-1.2M17.2 6.8l1.2-1.2"/></svg></button>
      <button class="rb on blue" aria-label="Трансляция" onclick="go('cast')"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H4a1.5 1.5 0 0 1-1.5-1.5v-10A1.5 1.5 0 0 1 4 4h16a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 17h-1"/><path d="M12 14l5 6H7z"/></svg></button>
      <button class="rb" aria-label="HDMI" onclick="go('hdmi')"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M3 8h18v5l-3 3H6l-3-3z"/></svg></button>
      <button class="rb" aria-label="Все приложения" onclick="go('apps')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></button>
    </div>

    <div class="mod lg s2 np">
      <div class="art" id="art"></div>
      <div class="air"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H4a1.5 1.5 0 0 1-1.5-1.5v-10A1.5 1.5 0 0 1 4 4h16a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 17h-1"/><path d="M12 14l5 6H7z"/></svg></div>
      <div><b id="tt">Ничего не играет</b><span id="ta">На HY300 Pro</span></div>
      <div class="ctl">
        <button aria-label="Предыдущий" onclick="media('prev')"><svg width="26" height="20" viewBox="0 0 30 24"><path d="M14 4v16L3 12zM27 4v16L16 12z"/></svg></button>
        <button aria-label="Пауза" onclick="media('play')"><svg id="pp" width="26" height="26" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
        <button aria-label="Следующий" onclick="media('next')"><svg width="26" height="20" viewBox="0 0 30 24"><path d="M3 4v16l11-8zM16 4v16l11-8z"/></svg></button>
      </div>
    </div>

    <button class="rb" id="mute2" aria-label="Без звука" onclick="vol('mute')" style="background:rgba(255,255,255,.14)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    <button class="rb" id="kbtn" aria-label="Ввести текст" onclick="toggleTyper()" style="background:rgba(255,255,255,.14)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M6.5 10h1M10.5 10h1M14.5 10h1M8 14h8"/></svg></button>
    <div class="mod lg vs h2" id="vbr" aria-label="Яркость"><div class="fill" id="vbrf"></div>
      <svg class="ic" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="#FFD60A"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></div>
    <div class="mod lg vs h2" id="vvol" aria-label="Громкость"><div class="fill" id="vvolf"></div>
      <svg class="ic" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="#0A84FF"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></div>

    <button class="mod lg w2 pill" id="tgsl" onclick="toggleSleep()" aria-label="Сон после 23:00">
      <span class="dotc"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E5CE6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="#5E5CE6"/></svg></span>
      <span><b>Сон</b><span id="slst">После 23:00 · вкл</span></span>
    </button>

    <div class="mod lg w4 warm" id="warmcard"><small>Night Shift</small><div class="hs" id="hs"><div class="knob" id="knob"></div></div></div>

    <button class="rb lg" aria-label="YouTube" onclick="go('youtube')"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="4"/><path d="M10 8.8v6.4l5.3-3.2z" fill="#F5F5F7" stroke="none"/></svg></button>
    <button class="rb lg" aria-label="Netflix" onclick="go('netflix')"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M7.5 3.5v17M16.5 3.5v17M3.5 8h4M3.5 12h4M3.5 16h4M16.5 8h4M16.5 12h4M16.5 16h4"/></svg></button>
    <button class="rb lg" aria-label="Spotify" onclick="go('spotify')"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    <button class="rb lg" aria-label="Браузер" onclick="go('browser')"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></button>
    <button class="rb lg" aria-label="Настройки проектора" onclick="go('settings')"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
    <button class="rb lg" aria-label="Проверить таймер: выключить через 40 секунд" onclick="sleepTest()"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg></button>
    <button class="rb lg" aria-label="Домой" onclick="key('home');closeSheet()"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6" stroke-linecap="round"/></svg></button>
  </div>

  <div class="typer" id="typer"><input id="tx" placeholder="Текст или поиск" autocomplete="off" autocapitalize="off" enterkeyhint="send"><button onclick="ytSearch()" aria-label="Искать в YouTube" style="background:#F5F5F7;padding:0 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="4"/><path d="M10 8.8v6.4l5.3-3.2z" fill="#1C1C1E" stroke="none"/></svg></button><button onclick="sendText()">Ввести</button></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const api=p=>fetch(p).then(r=>r.json()).catch(()=>({ok:false}));
const key=k=>api('/api/key?k='+k);
const media=c=>api('/api/media?c='+c).then(()=>setTimeout(refresh,300));
const vol=d=>api('/api/vol?d='+d).then(refresh);
function go(a){api('/api/launch?app='+a);closeSheet()}

/* ---------- control center: open; close with ✕, a tap on empty space or a swipe ---------- */
const cc=$('cc');
function openSheet(){cc.classList.add('show');cc.scrollTop=0;refresh()}
function closeSheet(){cc.classList.remove('show');$('tx').blur()}
cc.addEventListener('click',e=>{if(e.target===cc||e.target===$('ccin')||e.target.classList.contains('grid'))closeSheet()});
(function(){let y0=null;cc.addEventListener('touchstart',e=>{y0=cc.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
  cc.addEventListener('touchend',e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;if(dy>110)closeSheet();y0=null},{passive:true})})();
function toggleTyper(){const t=$('typer');t.classList.toggle('show');if(t.classList.contains('show'))$('tx').focus()}

/* ---------- touchpad gestures ---------- */
const pad=$('pad'),glow=$('glow');
const STEP=46;
let pts=new Map(),sx=0,sy=0,ox=0,oy=0,t0=0,axis=null,moved=false,two=false,vy=0,longT=null,toastT=null;
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),700)}
function pulse(el){el.classList.remove('go');void el.offsetWidth;el.classList.add('go')}
function step(dir){key(dir);pulse(pad.querySelector('.edge.'+dir));$('hint').style.opacity=0}
function pos(e){const r=pad.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
pad.addEventListener('pointerdown',e=>{
  pad.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);
  if(pts.size===2){two=true;clearTimeout(longT);vy=[...pts.values()].reduce((a,p)=>a+p.clientY,0)/2;return}
  if(pts.size>2)return;
  two=false;pad.classList.add('touch');
  const [x,y]=pos(e);glow.style.transform='translate('+x+'px,'+y+'px)';
  sx=ox=e.clientX;sy=oy=e.clientY;t0=Date.now();axis=null;moved=false;
  clearTimeout(longT);
  longT=setTimeout(()=>{if(!moved&&!axis&&!two){key('menu');toast('Меню');moved=true}},650);
});
pad.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);
  if(two){
    const y=[...pts.values()].reduce((a,p)=>a+p.clientY,0)/pts.size;
    if(Math.abs(y-vy)>=28){const up=y<vy;vol(up?'up':'down');toast(up?'Громче':'Тише');vy=y;moved=true}
    return;
  }
  const [x,yy]=pos(e);glow.style.transform='translate('+x+'px,'+yy+'px)';
  const dx=e.clientX-ox,dy=e.clientY-oy;
  if(!axis&&Math.hypot(e.clientX-sx,e.clientY-sy)>14){axis=Math.abs(e.clientX-sx)>Math.abs(e.clientY-sy)?'x':'y';clearTimeout(longT)}
  if(axis==='x'&&Math.abs(dx)>=STEP){step(dx>0?'right':'left');ox+=Math.sign(dx)*STEP;oy=e.clientY;moved=true}
  if(axis==='y'&&Math.abs(dy)>=STEP){step(dy>0?'down':'up');oy+=Math.sign(dy)*STEP;ox=e.clientX;moved=true}
});
function up(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(pts.size>0)return;
  clearTimeout(longT);pad.classList.remove('touch');
  if(!two&&!moved&&!axis&&Date.now()-t0<400){key('ok');const r=$('ring');const [x,y]=pos(e);r.style.left=x+'px';r.style.top=y+'px';pulse(r);$('hint').style.opacity=0}
  two=false;
}
pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);

/* ---------- vertical sliders (sound, brightness) and the warmth slider ---------- */
function vSlider(el,fill,pct,onValue,min){
  let on=false,t=null;
  const val=e=>{const r=el.getBoundingClientRect();return Math.round(Math.min(1,Math.max(0,(r.bottom-e.clientY)/r.height))*100)};
  const show=v=>{fill.style.transform='scaleY('+(v/100)+')';if(pct)pct.textContent=v+'%'};
  const set=v=>{v=Math.max(min,v);show(v);clearTimeout(t);t=setTimeout(()=>onValue(v),60)};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);on=true;el.dataset.drag=1;set(val(e))});
  el.addEventListener('pointermove',e=>{if(on)set(val(e))});
  ['pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{on=false;setTimeout(()=>{delete el.dataset.drag},600)}));
  return show;
}
const showVol=vSlider($('vvol'),$('vvolf'),null,v=>api('/api/vol?set='+v),0);
const showBr=vSlider($('vbr'),$('vbrf'),null,v=>api('/api/brightness?v='+v),5);
(function(){
  const el=$('hs'),k=$('knob');let on=false,t=null;
  const val=e=>{const r=el.getBoundingClientRect();return Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*100)};
  const set=v=>{k.style.left=(6+v*0.88)+'%';clearTimeout(t);t=setTimeout(()=>api('/api/warmth?v='+v),60)};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);on=true;el.dataset.drag=1;set(val(e))});
  el.addEventListener('pointermove',e=>{if(on)set(val(e))});
  ['pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{on=false;setTimeout(()=>{delete el.dataset.drag},600)}));
})();

let warmOn=false,sleepOn=true;
function paintWarm(){$('tgns').classList.toggle('on',warmOn);$('warmcard').classList.toggle('show',warmOn)}
function paintSleep(){$('tgsl').classList.toggle('on',sleepOn);$('slst').textContent='После 23:00 · '+(sleepOn?'вкл':'выкл')}
function toggleWarm(){warmOn=!warmOn;paintWarm();api('/api/warm?on='+(warmOn?1:0))}
function sleepTest(){if(confirm('Выключить проектор через 40 секунд? Любое нажатие на пульте отменит.')){api('/api/sleeptest');closeSheet()}}
function toggleSleep(){sleepOn=!sleepOn;paintSleep();api('/api/sleep?on='+(sleepOn?1:0))}

function ytSearch(){const i=$('tx');if(!i.value)return;api('/api/ytsearch?q='+encodeURIComponent(i.value));i.value='';closeSheet()}
function sendText(){const i=$('tx');if(!i.value)return;api('/api/text?t='+encodeURIComponent(i.value));i.value=''}
$('tx').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendText();setTimeout(()=>key('enter'),250)}});

/* ---------- keyboard bar ---------- */
const kbar=$('kbar'),kin=$('kin');
let kbarOpen=false,dismissedAt=0,liveT=null,editing=false,kmode='field';
function openYtSearch(){kmode='yt';kin.value='';kin.placeholder='Поиск в YouTube';kbarOpen=true;kbar.classList.add('show');kin.focus()}
function showKbar(text){if(kbarOpen)return;kbarOpen=true;if(!editing)kin.value=text||'';kbar.classList.add('show');try{kin.focus()}catch(e){}}
function hideKbar(byUser){kbarOpen=false;editing=false;kbar.classList.remove('show');kin.blur();if(byUser)dismissedAt=Date.now();kmode='field';kin.placeholder='Нажми и печатай'}
kin.addEventListener('focus',()=>{editing=true});
kin.addEventListener('input',()=>{if(kmode==='yt')return;clearTimeout(liveT);liveT=setTimeout(()=>api('/api/settext?t='+encodeURIComponent(kin.value)),120)});
function submitKbar(){if(kmode==='yt'){if(kin.value)api('/api/ytsearch?q='+encodeURIComponent(kin.value));hideKbar(true);return}clearTimeout(liveT);api('/api/settext?t='+encodeURIComponent(kin.value)).then(()=>setTimeout(()=>api('/api/submit'),150));hideKbar(true)}
kin.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitKbar()}});

/* ---------- live state ---------- */
let lastArt='',last={};
const setText=(id,v)=>{if(last[id]!==v){last[id]=v;$(id).textContent=v}};
const setHTML=(id,v)=>{if(last[id]!==v){last[id]=v;$(id).innerHTML=v}};
function refresh(){
  api('/api/state').then(s=>{
    const on=s&&s.volume!==undefined;
    $('dot').classList.toggle('on',on);
    setText('st',on?'Проектор':'Нет связи');
    if(!on)return;
    $('mute').classList.toggle('on',!!s.muted);
    $('mute2').classList.toggle('white',!!s.muted);$('ccdot').classList.add('on');
    if(!$('vvol').dataset.drag&&last.vol!==(s.muted?0:s.volume)){last.vol=s.muted?0:s.volume;showVol(last.vol)}
    if(s.brightness!==undefined&&!$('vbr').dataset.drag&&last.br!==s.brightness){last.br=s.brightness;showBr(s.brightness)}
    if(s.warmth!==undefined&&!$('hs').dataset.drag)$('knob').style.left=(6+s.warmth*0.88)+'%';
    if(s.warm!==undefined&&s.warm!==warmOn){warmOn=s.warm;paintWarm()}
    if(s.sleep!==undefined&&s.sleep!==sleepOn){sleepOn=s.sleep;paintSleep()}
    $('warn').classList.toggle('show',!s.adb);
    if(s.typing&&s.typingAt>dismissedAt)showKbar(s.text);
    else if(!s.typing&&kbarOpen&&!editing&&kmode!=='yt')hideKbar(false);
    $('ytpill').classList.toggle('show',!!(s.fg&&s.fg.indexOf('youtube')>=0)&&!kbarOpen);
    const m=s.media;
    setText('tt',m?m.title:'Ничего не играет');
    setText('ta',m?((m.artist?m.artist+' · ':'')+'на HY300 Pro'):'На HY300 Pro');
    setHTML('pp',m&&m.playing?'<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>':'<path d="M7 4v16l13-8z"/>');
    const k=m&&m.art?m.title:'';
    if(k!==lastArt){lastArt=k;$('art').style.backgroundImage=k?'url(/api/art?'+Date.now()+')':'none'}
  });
}
paintSleep();refresh();setInterval(()=>{if(!document.hidden)refresh()},1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
