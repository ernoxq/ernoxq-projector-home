name: Build APK

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Projector Home's own AirPlay receiver: the open-source receiver (jqssun/android-airplay-server, GPL-3.0)
  # with our patches from airplay/. Built only when airplay/ changes; otherwise the cached APK is reused.
  # If it fails, the launcher is still released (the projector keeps the receiver it has).
  receiver:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Upstream version
        id: up
        run: echo "sha=$(cat airplay/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: rx-out
          key: receiver-${{ hashFiles('airplay/**') }}

      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: jqssun/android-airplay-server
          ref: ${{ steps.up.outputs.sha }}
          path: rx
          submodules: recursive

      - uses: actions/setup-java@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Build receiver
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 airplay/patch.py rx "$(cat airplay/VERSION)"
          cat > rx/local.properties <<PROPS
          storeFile=$GITHUB_WORKSPACE/keystore/release.jks
          storePassword=grinhome
          keyAlias=grin
          keyPassword=grinhome
          PROPS
          sed -i 's/^ *//' rx/local.properties
          cd rx
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p ../rx-out
          cp app/build/outputs/apk/release/app-release.apk ../rx-out/airplay-receiver.apk

      - uses: actions/upload-artifact@v4
        with:
          name: receiver
          path: rx-out/airplay-receiver.apk

  build:
    needs: receiver
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Inter Tight font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/InterTight.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/intertight/InterTight%5Bwght%5D.ttf" || echo "font download failed, using system font"
          curl -fsSL -o app/src/main/assets/fonts/InterTight-Italic.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/intertight/InterTight-Italic%5Bwght%5D.ttf" || echo "italic font download failed"

      - name: Build launcher
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: receiver
          path: rx-out

      - name: Collect APKs (launcher + our AirPlay receiver)
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/projector-home.apk
          if [ -f rx-out/airplay-receiver.apk ]; then cp rx-out/airplay-receiver.apk out/airplay-receiver.apk; else echo "AirPlay receiver not built this time"; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      # Only main reaches the projector; other branches just build (APK in the run's artifacts).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Projector Home 1.0.${{ github.run_number }}
          make_latest: true
          files: out/*.apk
