<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Пульт">
<meta name="theme-color" content="#C9D3EA">
<title>Пульт</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{--ground:#C9D3EA;--ink:#121212;--soft:#EEF1F7;--glass:rgba(255,255,255,.6);--muted:#555B66;--accent:#FBE38E;--night:#2B3247}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Inter Tight',-apple-system,system-ui,sans-serif;overscroll-behavior:none}
.app{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:16px;min-height:100vh}
button{font-family:inherit;border:none;color:var(--ink);cursor:pointer;transition:transform .12s ease,background .2s}
button:active{transform:scale(.93)}
.circle{width:44px;height:44px;border-radius:22px;background:var(--glass);display:flex;align-items:center;justify-content:center}
header{display:flex;align-items:center;justify-content:space-between}
.status{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.dot{width:8px;height:8px;border-radius:4px;background:#9AA1AE}
.dot.on{background:#2E9E5B}
h1{margin:4px 0 0;font-size:38px;line-height:1.02;font-weight:600;letter-spacing:-1.3px}
h1 em{font-weight:600}
.np{background:#fff;border-radius:30px;padding:12px;display:flex;align-items:center;gap:12px}
.art{width:56px;height:56px;border-radius:18px;background:var(--night) center/cover no-repeat;flex-shrink:0}
.np .t{flex:1;min-width:0}
.np b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.np .ctl{display:flex;gap:6px}
.np .ctl button{width:42px;height:42px;border-radius:21px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.np .ctl .main{background:var(--accent);width:48px;height:48px;border-radius:24px}
.pad{display:flex;gap:12px}
.dpad{width:min(62vw,236px);aspect-ratio:1;border-radius:50%;background:#fff;position:relative;flex-shrink:0}
.dpad button{position:absolute;background:transparent;width:30%;height:30%;display:flex;align-items:center;justify-content:center;border-radius:50%}
.dpad .u{left:35%;top:3%}.dpad .d{left:35%;bottom:3%}.dpad .l{left:3%;top:35%}.dpad .r{right:3%;top:35%}
.dpad .ok{left:30%;top:30%;width:40%;height:40%;background:var(--ink);color:#fff;font-size:20px;font-weight:600}
.vol{flex:1;background:#fff;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0}
.vol button{width:60px;height:60px;border-radius:30px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.vol small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{height:56px;border-radius:28px;background:var(--glass);display:flex;align-items:center;justify-content:center}
.apps{display:flex;gap:10px;flex-wrap:wrap}
.apps button{height:44px;padding:0 18px;border-radius:22px;background:#fff;font-size:15px;font-weight:500}
.apps .dark{background:var(--ink);color:#fff}
.apps .acc{background:var(--accent);font-weight:600}
.typer{display:none;gap:8px}
.typer.show{display:flex}
.typer input{flex:1;height:48px;border-radius:24px;border:none;padding:0 18px;font:500 16px 'Inter Tight',sans-serif;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.typer button{height:48px;padding:0 18px;border-radius:24px;background:var(--ink);color:#fff;font-weight:600}
.warn{display:none;background:var(--accent);border-radius:22px;padding:12px 16px;font-size:14px;line-height:1.35}
.warn.show{display:block}
.warn button{margin-top:8px;height:38px;padding:0 16px;border-radius:19px;background:var(--ink);color:#fff;font-weight:600}
svg{display:block}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="circle" aria-label="Домой" onclick="key('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="#121212"><path d="M12 3l9 7.5V21h-6v-6H9v6H3V10.5z"/></svg></button>
    <div class="status"><span class="dot" id="dot"></span><span id="st">Подключаюсь…</span></div>
    <button class="circle" aria-label="Выключить" style="background:#121212" onclick="if(confirm('Выключить проектор?'))key('power')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
  </header>

  <h1 id="hello">Привет,<br><em>что включаем?</em></h1>

  <div class="warn" id="warn">Кнопки направлений ещё не подключены. Нажми «Настроить» и на проекторе выбери <b>Always allow</b>.<br><button onclick="api('/api/setup')">Настроить</button></div>

  <div class="np">
    <div class="art" id="art"></div>
    <div class="t"><b id="tt">Ничего не играет</b><span id="ta">Включи музыку</span></div>
    <div class="ctl">
      <button aria-label="Назад" onclick="media('prev')"><svg width="14" height="14" viewBox="0 0 24 24" fill="#121212"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="main" aria-label="Пауза" onclick="media('play')"><svg id="pp" width="16" height="16" viewBox="0 0 24 24" fill="#121212"><path d="M8 5v14l11-7z"/></svg></button>
      <button aria-label="Дальше" onclick="media('next')"><svg width="14" height="14" viewBox="0 0 24 24" fill="#121212"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg></button>
    </div>
  </div>

  <div class="pad">
    <div class="dpad">
      <button class="u" aria-label="Вверх" data-k="up"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="d" aria-label="Вниз" data-k="down"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="l" aria-label="Влево" data-k="left"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="r" aria-label="Вправо" data-k="right"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="ok" data-k="ok">OK</button>
    </div>
    <div class="vol">
      <button aria-label="Громче" data-v="up"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <small id="vl">ЗВУК</small>
      <button aria-label="Тише" data-v="down"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    </div>
  </div>

  <div class="keys">
    <button aria-label="Назад" data-k="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button aria-label="Меню" data-k="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg></button>
    <button aria-label="Без звука" onclick="vol('mute')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></button>
    <button aria-label="Ввести текст" onclick="toggleType()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M7 14h10"/></svg></button>
  </div>

  <div class="typer" id="typer"><input id="tx" placeholder="Текст латиницей" autocomplete="off" autocapitalize="off"><button onclick="sendText()">Ввести</button></div>

  <div class="apps">
    <button class="dark" onclick="launch('youtube')">YouTube</button>
    <button onclick="launch('netflix')">Netflix</button>
    <button onclick="launch('spotify')">Spotify</button>
    <button onclick="launch('hdmi')">HDMI</button>
    <button onclick="launch('apps')">Все приложения</button>
    <button class="acc" onclick="launch('cast')">Трансляция</button>
  </div>
</div>
<script>
const api=(p)=>fetch(p).then(r=>r.json()).catch(()=>({ok:false}));
const key=(k)=>api('/api/key?k='+k);
const vol=(d)=>api('/api/vol?d='+d).then(refresh);
const media=(c)=>api('/api/media?c='+c).then(()=>setTimeout(refresh,300));
const launch=(a)=>api('/api/launch?app='+a);
function toggleType(){const t=document.getElementById('typer');t.classList.toggle('show');if(t.classList.contains('show'))document.getElementById('tx').focus()}
function sendText(){const i=document.getElementById('tx');if(!i.value)return;api('/api/text?t='+encodeURIComponent(i.value)).then(()=>key('enter'));i.value=''}
document.getElementById('tx').addEventListener('keydown',e=>{if(e.key==='Enter')sendText()});

// Hold a button to repeat, like a real remote.
function holdable(el,fire){let t1,t2;const stop=()=>{clearTimeout(t1);clearInterval(t2)};
  el.addEventListener('pointerdown',e=>{e.preventDefault();fire();t1=setTimeout(()=>t2=setInterval(fire,140),420)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));}
document.querySelectorAll('[data-k]').forEach(b=>holdable(b,()=>key(b.dataset.k)));
document.querySelectorAll('[data-v]').forEach(b=>holdable(b,()=>vol(b.dataset.v)));

const h=new Date().getHours();
document.getElementById('hello').innerHTML=(h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':h<23?'Добрый вечер':'Доброй ночи')+',<br><em>что включаем?</em>';

let lastArt='';
function refresh(){
  api('/api/state').then(s=>{
    const on=s&&s.volume!==undefined;
    document.getElementById('dot').classList.toggle('on',on);
    document.getElementById('st').textContent=on?'Проектор · в сети':'Нет связи';
    if(!on)return;
    document.getElementById('vl').textContent=s.muted?'БЕЗ ЗВУКА':'ЗВУК '+s.volume;
    document.getElementById('warn').classList.toggle('show',!s.adb);
    const m=s.media;
    document.getElementById('tt').textContent=m?m.title:'Ничего не играет';
    document.getElementById('ta').textContent=m?(m.artist||m.source):'Включи музыку';
    document.getElementById('pp').innerHTML=m&&m.playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
    const art=document.getElementById('art');const k=m&&m.art?m.title:'';
    if(k!==lastArt){lastArt=k;art.style.backgroundImage=k?'url(/api/art?'+Date.now()+')':'none'}
  });
}
refresh();setInterval(refresh,2000);
</script>
</body>
</html>
